<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM-Demonstrator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4 A28 28 0 0 1 60 32 A20 20 0 0 0 32 12 Z' fill='%2301AEED'/%3E%3Cpath d='M60 32 A28 28 0 0 1 32 60 A20 20 0 0 0 52 32 Z' fill='%2355A730'/%3E%3Cpath d='M32 60 A28 28 0 0 1 4 32 A20 20 0 0 0 32 52 Z' fill='%23C81164'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23045273'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%231482AC'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<!-- palette.js steht im KOPF und ohne defer: sie schreibt die Farben der
     gewaehlten Fassung auf <html>, bevor der Koerper gezeichnet wird. Weiter
     unten bei den uebrigen Skripten wuerde die falsche Fassung kurz
     aufblitzen — im Hoersaal ein weisses Bild, das fuer einen Wimpernschlag
     schwarz wird. -->
<script src="palette.js"></script>
</head>
<body>

<header class="oben">
  <div class="band"></div>
  <div class="inhalt">
    <button class="home" id="home" title="Zur Übersicht" type="button">
      <span class="zeichen">⌂</span>
      <span class="wort">Übersicht</span>
    </button>
    <div class="titelblock">
      <div class="unter" id="unter">Demonstrator</div>
      <h1 id="titel">Große Sprachmodelle</h1>
    </div>
    <!-- Der Umschalter steht im Markup und nicht im Skript, damit er beim
         Laden sofort richtig aussieht: welche Seite hervorgehoben ist,
         entscheidet die CSS am Attribut data-fassung, das palette.js schon
         im Kopf gesetzt hat. -->
    <div class="fassung" id="fassung" role="group" aria-label="Darstellung">
      <button type="button" data-fassung="hell"
              title="Heller Grund — für die Projektion im Hörsaal">Hörsaal</button>
      <button type="button" data-fassung="dunkel"
              title="Dunkler Grund — am Bildschirm">Dunkel</button>
    </div>
    <div class="modellinfo" id="modellinfo"></div>
  </div>
</header>

<main id="scroller"><div class="wrap" id="inhalt"></div></main>

<footer class="unten">
  <strong>Prof. Dr.-Ing. Jörg W. Fischer</strong>
  <span>IT-Technologien — Digitalisierung</span>
  <span class="rechts" id="fusszeile">läuft lokal · kein Internet</span>
</footer>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="raum3d.js"></script>
<script src="vendor/d3.v7.min.js"></script>
<script src="zeichnen.js"></script>
<script src="linien.js"></script>
<script src="bahn.js"></script>
<script src="feedforward.js"></script>
<script src="kacheln.js"></script>
<script src="app.js"></script>
</body>
</html>
